name: Build Signed Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: 'on-failure'
          add-job-summary-as-pr-comment: 'never'

      - name: Prepare Gradle Wrapper & Permissions
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.11.1 || gradle wrapper
          fi
          chmod +x gradlew || true

      - name: Prepare Environment & Secrets Placeholders
        run: |
          # Ensure .env and .env.example exist to satisfy Secrets Gradle Plugin
          touch .env && touch .env.example
          # Ensure app/.env also exists if evaluated locally
          touch app/.env && touch app/.env.example

      - name: Setup Keystore & Detect Alias Dynamically
        run: |
          STORE_PASS="${{ secrets.STORE_PASSWORD }}"
          [ -z "$STORE_PASS" ] && STORE_PASS="android"
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          [ -z "$KEY_PASS" ] && KEY_PASS="android"
          
          KEYSTORE_FILE="my-upload-key.jks"
          
          # Generate a valid release keystore if none exists
          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "Keystore not found. Generating a new release keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=toDus Download, OU=Android, O=toDus, L=Havana, ST=Havana, C=CU"
            DETECTED_ALIAS="upload"
          else
            echo "Keystore found. Detecting alias dynamically..."
            DETECTED_ALIAS=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASS" 2>/dev/null | grep -i "Alias name:" | head -n 1 | awk -F': ' '{print $2}' | xargs)
            if [ -z "$DETECTED_ALIAS" ]; then
              echo "Could not parse alias from keytool; defaulting to 'upload'"
              DETECTED_ALIAS="upload"
            fi
          fi
          
          echo "Using keystore alias: $DETECTED_ALIAS"
          
          # Ensure redundant copies in root and app module
          cp "$KEYSTORE_FILE" "app/$KEYSTORE_FILE"
          
          # Export to GitHub Environment
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=$DETECTED_ALIAS" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            -Dkotlin.compiler.execution.strategy=daemon \
            -Dksp.incremental=false \
            -Dksp.incremental.intermodule=false \
            --stacktrace

      - name: Verify Generated APK
        run: |
          APK_COUNT=$(find app/build/outputs/apk/release/ -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No Release APK found in app/build/outputs/apk/release/!"
            exit 1
          fi
          echo "Release APK successfully generated:"
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
